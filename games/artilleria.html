<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artillería</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css"></head>
<body><div id="app"></div>
<script src="../shared/audio.js"></script><script src="../shared/engine.js"></script>
<script>
'use strict';
const W = 960, H = 600, GR = 380, NL = 8;
const LV = [
  { foes: 1, hp: 80, err: 10, wind: .3 }, { foes: 1, hp: 100, err: 8, wind: .5 }, { foes: 1, hp: 110, err: 6, wind: .7 }, { foes: 2, hp: 80, err: 7, wind: .6 },
  { foes: 2, hp: 100, err: 5.5, wind: .8 }, { foes: 2, hp: 80, err: 4.5, wind: 1 }, { foes: 3, hp: 60, err: 4.5, wind: 1 }, { foes: 3, hp: 70, err: 3.8, wind: 1.2 }
];
const WEAP = [{ name: 'Obús', r: 36, dmg: 45 }, { name: 'Triple', r: 24, dmg: 26 }, { name: 'Megabomba', r: 72, dmg: 75 }];
const P = new Engine.Particles();
let S = null;
const later = (fn, ms) => { const my = S; setTimeout(() => { if (S === my) fn(); }, ms); };
const G = Engine.create({
  id: 'artilleria', title: 'Artillería', genre: 'Estrategia · por turnos', accent: '#5b7a3a', bg: '#eef0e6',
  glyph: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 52c10-10 18-6 26-10s16-12 26-8"/><rect x="12" y="38" width="16" height="8" rx="2" fill="currentColor"/><path d="M22 38l10-10"/><path d="M36 22c6-8 14-8 18 2" stroke-dasharray="3 5"/></svg>',
  tagline: 'Ajusta ángulo y potencia, ten en cuenta el viento y destruye los tanques rivales antes de que te alcancen.',
  help: ['<b>↑ ↓</b> ángulo · <b>← →</b> potencia · <b>Espacio</b> dispara', 'O <b>arrastra</b> desde tu tanque y suelta para disparar', '<b>1 2 3</b> cambian de arma: obús, triple y megabomba (limitadas)', 'El viento desvía los proyectiles · las explosiones abren cráteres'],
  levels: NL, maxScale: 1.3,
  song: { bpm: 80, root: 48, scale: 'harm', prog: [0, 5, 3, 4], padInst: 'strings', arpInst: 'softpluck', arp: 'x.....x.....x...', arpOct: 3, leadInst: 'warm', leadOct: 4, leadDensity: .3, kick: 'x.......x.......', snare: '............x...', hat: '', bass: 'x.......x.......', bassLen: 6, fill: true, seed: 251 },
  intensity: () => 1,
  onLevel: load,
  onReady(g) {
    g.canvas(W, H); g.loop(update, render);
    let drag = false;
    g.cv.addEventListener('pointerdown', e => {
      if (!S || S.state !== 'aim' || !G.playing || G.paused) return;
      const p = g.pos(e);
      for (let i = 0; i < 3; i++) if (p.x > 20 + i * 130 && p.x < 140 + i * 130 && p.y > 16 && p.y < 52) { pickWeapon(i); return; }
      drag = true; aimAt(p); g.cv.setPointerCapture(e.pointerId);
    });
    g.cv.addEventListener('pointermove', e => { if (drag) aimAt(g.pos(e)); });
    g.cv.addEventListener('pointerup', () => { if (drag) { drag = false; fire(); } });
    addEventListener('keydown', e => { if (e.code === 'Space') fire(); if (e.key >= '1' && e.key <= '3') pickWeapon(+e.key - 1); });
  }
});
function load(n) {
  const cfg = LV[n - 1], r = Engine.rng(n * 2003 + 7);
  const surf = new Float32Array(W);
  const a1 = 40 + r() * 50, a2 = 20 + r() * 30, f1 = .004 + r() * .004, f2 = .011 + r() * .008, p1 = r() * 6, p2 = r() * 6;
  for (let x = 0; x < W; x++) surf[x] = 410 + Math.sin(x * f1 + p1) * a1 + Math.sin(x * f2 + p2) * a2 - (x > 300 && x < 660 ? 60 * Math.sin((x - 300) / 360 * Math.PI) * (n > 2 ? 1 : .4) : 0);
  const spots = [110, W - 110, W - 280, W - 440].slice(0, cfg.foes + 1);
  for (const sx of spots) { const y = surf[sx]; for (let x = sx - 26; x <= sx + 26; x++) surf[x] = y; }
  const tanks = spots.map((x, i) => ({ x, y: surf[x], hp: i ? cfg.hp : 100 + 50 * (cfg.foes - 1), max: i ? cfg.hp : 100 + 50 * (cfg.foes - 1), ai: i > 0, alive: true, ang: i ? 135 : 45, pow: 520, col: i ? '#c2553d' : '#2f6df6', err: cfg.err * 2.4, shake: 0 }));
  S = { n, cfg, surf, tanks, foeMul: 1 / cfg.foes, turn: 0, state: 'aim', shot: [], wind: 0, weapon: 0, ammo: [Infinity, n >= 2 ? 2 : 0, n >= 3 ? 1 : 0], t: 0, shots: 0, flash: 0, msg: '', done: false };
  newWind(); P.clear(); hud();
}
function hud() { const me = S.tanks[0]; G.hud({ Nivel: `${S.n}/${NL}`, Blindaje: Math.max(0, Math.round(me.hp)), Rivales: S.tanks.filter(t => t.ai && t.alive).length, Viento: (S.wind > 0 ? '→ ' : S.wind < 0 ? '← ' : '') + Math.abs(S.wind * 10).toFixed(0) }); }
function newWind() { S.wind = Math.round((Math.random() * 2 - 1) * S.cfg.wind * 10) / 10; }
function pickWeapon(i) { if (!S || S.state !== 'aim') return; if (S.ammo[i] <= 0) { G.sfx('error'); return; } S.weapon = i; G.sfx('select'); }
function aimAt(p) {
  const me = S.tanks[0], dx = p.x - me.x, dy = (me.y - 14) - p.y;
  me.ang = Engine.clamp(Math.atan2(dy, dx) * 180 / Math.PI, 5, 175);
  me.pow = Engine.clamp(Math.hypot(dx, dy) * 3.2, 150, 980);
}
function launch(tk, ang, pow, w) {
  const a = ang * Math.PI / 180, spread = w === 1 ? [-5, 0, 5] : [0];
  for (const s of spread) { const b = a + s * Math.PI / 180; S.shot.push({ x: tk.x + Math.cos(a) * 20, y: tk.y - 14 - Math.sin(a) * 20, vx: Math.cos(b) * pow, vy: -Math.sin(b) * pow, w, owner: tk, t: 0 }); }
  S.state = 'fly'; S.shots++;
  G.sfx('boom', { pitch: 1.4, vol: .6, pan: G.pan(tk.x) });
  G.sfx('whistle', { d: 1.4, pan: G.pan(tk.x) });
  P.burst(tk.x + Math.cos(a) * 24, tk.y - 14 - Math.sin(a) * 24, 10, { color: ['#ffd36b', '#999'], speed: 120, life: .4, angle: -a, spread: .8 });
}
function fire() {
  if (!S || S.state !== 'aim' || S.turn !== 0 || !G.playing || G.paused) return;
  const me = S.tanks[0];
  if (S.ammo[S.weapon] <= 0) S.weapon = 0;
  S.ammo[S.weapon]--;
  launch(me, me.ang, me.pow, S.weapon);
  if (S.ammo[S.weapon] <= 0) S.weapon = 0;
}
function simulate(x, y, vx, vy, target) {
  for (let i = 0; i < 400; i++) {
    const d = 1 / 60; vx += S.wind * 40 * d; vy += GR * d; x += vx * d; y += vy * d;
    if (x < 0 || x >= W || y > H) return 9999;
    if (y >= S.surf[x | 0] || Math.hypot(x - target.x, y - target.y + 8) < 14) return Math.hypot(x - target.x, y - target.y);
  }
  return 9999;
}
function aiTurn(tk) {
  const me = S.tanks[0]; let best = null;
  for (let ang = 100; ang <= 170; ang += 3) for (let pow = 220; pow <= 950; pow += 25) {
    const a = ang * Math.PI / 180;
    const d = simulate(tk.x + Math.cos(a) * 20, tk.y - 14 - Math.sin(a) * 20, Math.cos(a) * pow, -Math.sin(a) * pow, me);
    if (!best || d < best.d) best = { d, ang, pow };
  }
  const g = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
  tk.ang = best.ang + g() * tk.err; tk.pow = best.pow * (1 + g() * tk.err / 90);
  tk.err = Math.max(S.cfg.err * .5, tk.err * .78);
  later(() => { if (S.state === 'ai') launch(tk, tk.ang, tk.pow, 0); }, 700);
}
function explode(x, y, w, owner) {
  const W2 = WEAP[w], R = W2.r;
  G.sfx(w === 2 ? 'explosion' : 'boom', { pan: G.pan(x) });
  P.burst(x, y, w === 2 ? 60 : 30, { color: ['#ffd36b', '#ff7a3d', '#6b5a4a', '#ffffff'], speed: w === 2 ? 420 : 280, gravity: 300 });
  S.flash = w === 2 ? .4 : .15;
  for (let i = Math.max(0, Math.floor(x - R)); i < Math.min(W, Math.ceil(x + R)); i++) {
    const yb = y + Math.sqrt(Math.max(0, R * R - (i - x) * (i - x)));
    if (S.surf[i] < yb) S.surf[i] = Math.min(H - 6, yb);
  }
  for (const t of S.tanks) {
    if (!t.alive) continue;
    const d = Math.hypot(t.x - x, (t.y - 8) - y);
    if (d < R + 26) {
      const dmg = Math.round(W2.dmg * (1 - d / (R + 30)) * (owner && owner.ai ? S.foeMul : 1));
      t.hp -= dmg; t.shake = .4;
      P.text(t.x, t.y - 40, '-' + dmg, { color: t.ai ? '#c2553d' : '#2f6df6', size: 20 });
      if (t.hp <= 0) { t.alive = false; G.sfx('explosion', { pitch: .8, pan: G.pan(t.x) }); P.burst(t.x, t.y - 10, 50, { color: ['#333', '#ff7a3d', '#ffd36b'], speed: 350, gravity: 400 }); }
    }
  }
  hud();
}
function nextTurn() {
  const me = S.tanks[0], foes = S.tanks.filter(t => t.ai && t.alive);
  if (me.hp <= 0) { S.done = true; later(() => G.lose('Tu tanque fue destruido', [['Disparos', S.shots], ['Rivales restantes', foes.length]]), 900); S.state = 'end'; return; }
  if (!foes.length) {
    S.done = true; S.state = 'end';
    const hp = me.hp / me.max * 100;
    later(() => G.win(hp >= 70 ? 3 : hp >= 35 ? 2 : 1, [['Blindaje', Math.round(hp)], ['Disparos', S.shots]], Math.round(hp * 10 - S.shots * 5)), 900);
    return;
  }
  let i = S.turn;
  do { i = (i + 1) % S.tanks.length; } while (!S.tanks[i].alive);
  S.turn = i; newWind(); hud();
  G.music.setIntensity(foes.length === 1 && foes[0].hp < foes[0].max / 2 ? 2 : 1);
  if (S.tanks[i].ai) { S.state = 'ai'; G.sfx('beep', { pitch: .8 }); aiTurn(S.tanks[i]); }
  else { S.state = 'aim'; G.sfx('beep'); }
}
function update(dt) {
  S.t += dt; S.flash = Math.max(0, S.flash - dt);
  const k = G.keys, me = S.tanks[0];
  if (S.state === 'aim') {
    if (k.ArrowUp || k.KeyW) me.ang = Math.min(175, me.ang + 45 * dt);
    if (k.ArrowDown || k.KeyS) me.ang = Math.max(5, me.ang - 45 * dt);
    if (k.ArrowRight || k.KeyD) me.pow = Math.min(980, me.pow + 320 * dt);
    if (k.ArrowLeft || k.KeyA) me.pow = Math.max(150, me.pow - 320 * dt);
  }
  for (const t of S.tanks) {
    t.shake = Math.max(0, t.shake - dt);
    const g = S.surf[Math.round(t.x)];
    if (t.y < g) t.y = Math.min(g, t.y + 200 * dt);
  }
  if (S.state === 'fly') {
    const steps = 4;
    for (let s = 0; s < steps; s++) {
      const d = dt / steps;
      for (const b of S.shot) {
        if (b.dead) continue;
        b.t += d; b.vx += S.wind * 40 * d; b.vy += GR * d; b.x += b.vx * d; b.y += b.vy * d;
        if (b.x < 0 || b.x >= W || b.y > H) { b.dead = true; continue; }
        const hitTank = S.tanks.find(t => t.alive && (t !== b.owner || b.t > .3) && Math.hypot(t.x - b.x, t.y - 8 - b.y) < 16);
        if (b.y >= S.surf[b.x | 0] || hitTank) { b.dead = true; explode(b.x, Math.min(b.y, S.surf[b.x | 0]), b.w, b.owner); }
      }
    }
    for (const b of S.shot) if (!b.dead && Math.random() < .5) P.burst(b.x, b.y, 1, { color: 'rgba(80,80,80,.5)', speed: 10, life: .5, size: 3 });
    S.shot = S.shot.filter(b => !b.dead);
    if (!S.shot.length) { S.state = 'settle'; later(nextTurn, 600); }
  }
  P.update(dt);
}
function render() {
  const c = G.ctx; if (!c || !S) return;
  const sky = c.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#dfe8ee'); sky.addColorStop(1, '#f4f1e6');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255,255,255,.7)';
  for (let i = 0; i < 4; i++) { const x = ((i * 280 + S.t * S.wind * 30) % (W + 200) + W + 200) % (W + 200) - 100; c.beginPath(); c.ellipse(x, 90 + i * 30, 70, 18, 0, 0, 6.283); c.fill(); }
  c.fillStyle = '#7d9a55'; c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x < W; x += 2) c.lineTo(x, S.surf[x]); c.lineTo(W, H); c.fill();
  c.fillStyle = '#5b7a3a'; c.beginPath(); c.moveTo(0, S.surf[0]);
  for (let x = 0; x < W; x += 2) c.lineTo(x, S.surf[x]); for (let x = W - 1; x >= 0; x -= 2) c.lineTo(x, S.surf[x] + 8); c.fill();
  for (const [i, t] of S.tanks.entries()) {
    if (!t.alive) { c.fillStyle = '#4a4a4a'; c.fillRect(t.x - 14, t.y - 8, 28, 8); continue; }
    const sh = t.shake ? (Math.random() - .5) * 6 : 0;
    c.save(); c.translate(t.x + sh, t.y);
    const a = t.ang * Math.PI / 180;
    c.strokeStyle = '#2b2b2b'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, -14); c.lineTo(Math.cos(a) * 22, -14 - Math.sin(a) * 22); c.stroke();
    c.fillStyle = t.col; c.beginPath(); c.arc(0, -12, 9, Math.PI, 0); c.fill();
    c.beginPath(); c.roundRect(-18, -12, 36, 10, 4); c.fill();
    c.fillStyle = '#2b2b2b'; c.beginPath(); c.roundRect(-20, -4, 40, 7, 3.5); c.fill();
    c.restore();
    c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(t.x - 20, t.y - 38, 40, 5);
    c.fillStyle = t.col; c.fillRect(t.x - 20, t.y - 38, 40 * Math.max(0, t.hp / t.max), 5);
    if (S.turn === i && S.state !== 'end') { c.fillStyle = t.col; c.beginPath(); c.moveTo(t.x - 6, t.y - 52); c.lineTo(t.x + 6, t.y - 52); c.lineTo(t.x, t.y - 44); c.fill(); }
  }
  const me = S.tanks[0];
  if (S.state === 'aim' && me.alive) {
    const a = me.ang * Math.PI / 180; let x = me.x + Math.cos(a) * 20, y = me.y - 14 - Math.sin(a) * 20, vx = Math.cos(a) * me.pow, vy = -Math.sin(a) * me.pow;
    const len = Math.max(14, 40 - S.n * 3);
    for (let i = 0; i < len; i++) { for (let j = 0; j < 2; j++) { const d = 1 / 60; vx += S.wind * 40 * d; vy += GR * d; x += vx * d; y += vy * d; } if (i % 2 === 0) { c.fillStyle = `rgba(47,109,246,${1 - i / len})`; c.beginPath(); c.arc(x, y, 2.5, 0, 6.283); c.fill(); } }
    c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(me.x - 30, me.y + 12, 60, 5); c.fillStyle = '#2f6df6'; c.fillRect(me.x - 30, me.y + 12, 60 * me.pow / 980, 5);
    c.fillStyle = '#1b1b1b'; c.font = '600 12px Inter, sans-serif'; c.textAlign = 'center'; c.fillText(`${Math.round(me.ang)}° · ${Math.round(me.pow / 9.8)}%`, me.x, me.y + 32);
  }
  for (const b of S.shot) { c.fillStyle = '#1b1b1b'; c.beginPath(); c.arc(b.x, b.y, b.w === 2 ? 7 : 4.5, 0, 6.283); c.fill(); }
  WEAP.forEach((w, i) => {
    const x = 20 + i * 130, on = S.weapon === i, n = S.ammo[i];
    c.fillStyle = on ? '#1b1b1b' : 'rgba(255,255,255,.75)'; c.beginPath(); c.roundRect(x, 16, 120, 36, 18); c.fill();
    c.fillStyle = on ? '#ffffff' : n > 0 ? '#1b1b1b' : 'rgba(0,0,0,.25)'; c.font = '600 13px Inter, sans-serif'; c.textAlign = 'center';
    c.fillText(`${i + 1} · ${w.name}${n === Infinity ? '' : ' ×' + n}`, x + 60, 39);
  });
  c.save(); c.translate(W / 2 + 160, 34); c.fillStyle = '#1b1b1b'; c.font = '600 12px Inter, sans-serif'; c.textAlign = 'center'; c.fillText('VIENTO', 0, -6);
  c.strokeStyle = '#1b1b1b'; c.lineWidth = 3; const L = S.wind * 50; c.beginPath(); c.moveTo(-L, 8); c.lineTo(L, 8); c.stroke();
  if (S.wind) { c.beginPath(); c.moveTo(L, 8); c.lineTo(L - Math.sign(L) * 8, 2); c.lineTo(L - Math.sign(L) * 8, 14); c.fill(); } c.restore();
  if (S.state === 'ai') { c.fillStyle = 'rgba(0,0,0,.5)'; c.font = '600 16px Inter, sans-serif'; c.textAlign = 'center'; c.fillText('El rival apunta…', W / 2, 110); }
  P.draw(c);
  if (S.flash) { c.fillStyle = `rgba(255,240,200,${S.flash})`; c.fillRect(0, 0, W, H); }
}
</script></body></html>
