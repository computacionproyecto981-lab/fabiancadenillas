<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Derrape</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css"></head>
<body><div id="app"></div>
<script src="../shared/audio.js"></script><script src="../shared/engine.js"></script>
<script>
'use strict';
const W = 960, H = 640, HW = 44, LAPS = 3;
const TRACKS = [
  { name: 'Óvalo', pts: [[200, 320], [260, 160], [480, 110], [700, 160], [760, 320], [700, 480], [480, 530], [260, 480]] },
  { name: 'Riñón', pts: [[180, 300], [250, 140], [450, 120], [560, 240], [700, 130], [820, 220], [800, 440], [600, 520], [380, 500], [220, 470]] },
  { name: 'Zigzag', pts: [[140, 520], [140, 140], [330, 140], [400, 400], [520, 140], [820, 140], [820, 520], [600, 520], [480, 330], [360, 520]] },
  { name: 'Horquilla', pts: [[120, 130], [840, 130], [860, 220], [820, 300], [320, 300], [290, 360], [320, 420], [820, 420], [860, 490], [820, 550], [120, 550], [80, 340]] },
  { name: 'Gota', pts: [[480, 90], [760, 200], [820, 420], [620, 560], [340, 560], [140, 420], [200, 200]] },
  { name: 'Rombo', pts: [[480, 70], [870, 320], [480, 570], [90, 320]] },
  { name: 'Serpiente', pts: [[110, 520], [110, 130], [250, 130], [260, 420], [400, 430], [400, 130], [540, 130], [550, 420], [690, 430], [690, 130], [850, 130], [850, 520]] },
  { name: 'Gran Premio', pts: [[150, 560], [150, 300], [260, 120], [420, 180], [500, 340], [620, 140], [820, 160], [860, 380], [720, 560], [520, 470], [360, 560]] }
];
const P = new Engine.Particles();
let S = null, engine = null, screech = null;
const later = (fn, ms) => { const my = S; setTimeout(() => { if (S === my) fn(); }, ms); };
const G = Engine.create({
  id: 'derrape', title: 'Derrape', genre: 'Carreras · conducción', accent: '#e5484d', bg: '#e9ebe6',
  display: { font: 'Racing Sans One', query: 'Racing+Sans+One', weight: 400, scale: 0.95, levels: 'Parrilla de Salida' },
  glyph: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M10 46c0-20 12-30 26-30s18 10 18 18-6 14-14 14H22"/><rect x="26" y="38" width="16" height="9" rx="3" fill="currentColor" transform="rotate(-20 34 42)"/><path d="M8 52h8M14 58h10" stroke-dasharray="2 4"/></svg>',
  tagline: 'Tres vueltas contra el rival fantasma. Frena antes de las curvas, derrapa y sal acelerando.',
  help: ['<b>↑</b> acelera · <b>↓</b> frena · <b>← →</b> giran', '<b>Espacio</b> es el freno de mano: derrapa en las curvas cerradas', 'Fuera del asfalto el coche pierde mucha velocidad', 'Gana al rival azul; con mucha ventaja, ★★★'],
  levels: TRACKS.length, maxScale: 1.3,
  song: { bpm: 124, root: 52, scale: 'mixo', prog: [0, 6, 3, 0], padInst: 'strings', arpInst: 'softpluck', arp: 'x.x.x.x.x.x.x.x.', arpOct: 3, leadInst: 'warm', leadOct: 4, leadDensity: .4, kick: 'x.......x.x.....', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', bass: 'x.x.x.x.x.x.x.x.', bassLen: 1.5, fill: true, seed: 271 },
  intensity: () => 1,
  onLevel: load,
  onPause(p) { if (p) { engine && engine.set({ vol: 0 }); screech && screech.set({ vol: 0 }); } },
  onReady(g) {
    g.canvas(W, H); g.loop(update, render);
    g.touch([{ label: '◀', code: 'ArrowLeft' }, { label: '▶', code: 'ArrowRight' }], [{ label: '⟲', code: 'Space' }, { label: '▼', code: 'ArrowDown' }, { label: '▲', code: 'ArrowUp' }]);
  }
});
function build(pts) {
  const out = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), steps = Math.max(4, Math.round(len / 8));
    for (let s = 0; s < steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => .5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push({ x: f(p0[0], p1[0], p2[0], p3[0]), y: f(p0[1], p1[1], p2[1], p3[1]) });
    }
  }
  let acc = 0;
  out.forEach((p, i) => { const q = out[(i + 1) % out.length]; p.d = acc; p.len = Math.hypot(q.x - p.x, q.y - p.y); acc += p.len; p.ang = Math.atan2(q.y - p.y, q.x - p.x); });
  out.forEach((p, i) => { let c = 0; for (let k = -6; k <= 6; k++) { const a = out[(i + k + out.length) % out.length], b = out[(i + k + 1 + out.length) % out.length]; let d = b.ang - a.ang; while (d > Math.PI) d -= 6.283; while (d < -Math.PI) d += 6.283; c += Math.abs(d); } p.curv = c; });
  return { pts: out, total: acc };
}
function load(n) {
  const tr = build(TRACKS[n - 1].pts), p0 = tr.pts[0];
  const base = 228 + n * 13;
  let rt = 0; for (const p of tr.pts) rt += p.len / (base * (1 - Math.min(.55, p.curv * .55)));
  S = { n, tr, car: { x: p0.x - Math.cos(p0.ang) * 30 + Math.sin(p0.ang) * 16, y: p0.y - Math.sin(p0.ang) * 30 - Math.cos(p0.ang) * 16, ang: p0.ang, vx: 0, vy: 0, idx: 0, prog: 0, off: false },
    rival: { d: -30, base, idx: 0, lap: 0, done: false }, rivalTotal: rt * LAPS, t: -3.2, lapTimes: [], lapStart: 0, skids: [], count: 4, done: false };
  if (engine) engine.stop(); if (screech) screech.stop();
  engine = G.A.loop({ type: 'sawtooth', f: 50, filter: 400, q: 2 });
  screech = G.A.loop({ type: 'noise', filter: 2200, ftype: 'bandpass', q: 3 });
  P.clear(); hud(); G.toast(`Circuito: ${TRACKS[n - 1].name}`);
}
function lapOf() { return Math.max(0, Math.floor(S.car.prog / S.tr.pts.length)); }
function hud() { G.hud({ Circuito: `${S.n}/${TRACKS.length}`, Vuelta: `${Math.min(LAPS, lapOf() + 1)}/${LAPS}`, Tiempo: Math.max(0, S.t).toFixed(1) + ' s', Rival: S.rival.done ? 'Meta' : `V${Math.min(LAPS, S.rival.lap + 1)}` }); }
function nearest(x, y, from) {
  const pts = S.tr.pts, N = pts.length; let best = from, bd = 1e9;
  for (let k = -40; k <= 40; k++) { const i = (from + k + N) % N, d = (pts[i].x - x) ** 2 + (pts[i].y - y) ** 2; if (d < bd) { bd = d; best = i; } }
  return [best, Math.sqrt(bd)];
}
function update(dt) {
  const c = S.car, k = G.keys, prevT = S.t;
  S.t += dt;
  if (S.t < 0) { const cd = Math.ceil(-S.t); if (cd !== S.count && cd <= 3) { S.count = cd; G.sfx('beep'); } engine.set({ vol: .04, f: 48 + (k.ArrowUp ? 30 : 0) }); return P.update(dt); }
  if (prevT < 0) { G.sfx('go'); S.count = 0; }
  const fx = Math.cos(c.ang), fy = Math.sin(c.ang);
  let vF = c.vx * fx + c.vy * fy, vL = -c.vx * fy + c.vy * fx;
  if (!S.done) {
    const gas = k.ArrowUp || k.KeyW, brake = k.ArrowDown || k.KeyS, hb = k.Space;
    const steer = (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0);
    if (gas) vF += 470 * dt;
    if (brake) vF -= (vF > 0 ? 760 : 260) * dt;
    if (hb) vF *= Math.exp(-1.2 * dt);
    c.ang += steer * 2.7 * Engine.clamp(Math.abs(vF) / 180, 0, 1) * Math.sign(vF || 1) * dt * (hb ? 1.35 : 1);
    vL *= Math.exp(-(hb ? 1.4 : 7.5) * dt);
  } else { vF *= Math.exp(-1.5 * dt); vL *= Math.exp(-4 * dt); }
  vF *= Math.exp(-.25 * dt);
  const [idx, dist] = nearest(c.x, c.y, c.idx);
  c.off = dist > HW;
  if (c.off && Math.abs(vF) > 170) vF *= Math.exp(-2.8 * dt);
  vF = Engine.clamp(vF, -160, 440);
  const nfx = Math.cos(c.ang), nfy = Math.sin(c.ang);
  c.vx = nfx * vF - nfy * vL; c.vy = nfy * vF + nfx * vL;
  c.x += c.vx * dt; c.y += c.vy * dt;
  if (dist > 150) { const p = S.tr.pts[idx]; c.x = p.x; c.y = p.y; c.ang = p.ang; c.vx = c.vy = 0; G.sfx('error'); G.toast('Vuelve a la pista'); }
  const N = S.tr.pts.length; let di = idx - c.idx; if (di > N / 2) di -= N; if (di < -N / 2) di += N;
  const lapBefore = lapOf(); c.prog += di; c.idx = idx;
  if (lapOf() > lapBefore && !S.done) {
    S.lapTimes.push(S.t - S.lapStart); S.lapStart = S.t;
    if (lapOf() >= LAPS) finish(); else { G.sfx('chime'); G.toast(`Vuelta ${lapOf() + 1}${lapOf() === LAPS - 1 ? ' · ¡última!' : ''}`); G.music.setIntensity(lapOf() === LAPS - 1 ? 2 : 1); }
  }
  // rival fantasma
  const r = S.rival;
  if (!r.done) {
    const p = S.tr.pts[r.idx];
    r.d += r.base * (1 - Math.min(.55, p.curv * .55)) * dt;
    while (r.d >= S.tr.pts[r.idx].d + S.tr.pts[r.idx].len) { r.idx++; if (r.idx >= N) { r.idx = 0; r.d -= S.tr.total; r.lap++; if (r.lap >= LAPS) { r.done = true; if (!S.done) rivalWins(); } } }
  }
  const slip = Math.abs(vL);
  screech.set({ vol: slip > 90 ? Math.min(.12, (slip - 90) / 900) : 0, filter: 1600 + slip * 2 });
  engine.set({ vol: S.done ? .015 : .045, f: 45 + Math.abs(vF) * .3, filter: 250 + Math.abs(vF) * 2.4 });
  if (slip > 110 && Math.random() < .8) { S.skids.push([c.x, c.y]); if (S.skids.length > 900) S.skids.shift(); }
  if (c.off && Math.abs(vF) > 120 && Math.random() < .4) P.burst(c.x, c.y, 1, { color: '#8a7a5a', speed: 40, life: .5, size: 4 });
  if (Math.floor(S.t * 10) !== Math.floor(prevT * 10)) hud();
  P.update(dt);
}
function finish() {
  S.done = true; G.sfx('win'); hud();
  const k = S.t / S.rivalTotal;
  later(() => G.win(k <= .9 ? 3 : k <= .96 ? 2 : 1, [['Tu tiempo', S.t.toFixed(2) + ' s'], ['Rival', S.rivalTotal.toFixed(2) + ' s'], ['Mejor vuelta', Math.min(...S.lapTimes).toFixed(2) + ' s']], Math.round(10000 - S.t * 50)), 900);
}
function rivalWins() { S.done = true; later(() => G.lose('El rival llegó primero', [['Tu vuelta', `${Math.min(LAPS, lapOf() + 1)}/${LAPS}`], ['Tiempo rival', S.rivalTotal.toFixed(1) + ' s']]), 600); }
function rivalPos() {
  const r = S.rival, pts = S.tr.pts, p = pts[r.idx], q = pts[(r.idx + 1) % pts.length], k = Engine.clamp((r.d - p.d) / (p.len || 1), 0, 1);
  return [p.x + (q.x - p.x) * k, p.y + (q.y - p.y) * k, p.ang];
}
function car(c, x, y, a, col, alpha) {
  c.save(); c.translate(x, y); c.rotate(a); c.globalAlpha = alpha;
  c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.roundRect(-16, -7, 34, 19, 6); c.fill();
  c.fillStyle = col; c.beginPath(); c.roundRect(-18, -10, 36, 20, 6); c.fill();
  c.fillStyle = 'rgba(255,255,255,.8)'; c.beginPath(); c.roundRect(2, -7, 9, 14, 3); c.fill();
  c.fillStyle = '#222'; for (const [ox, oy] of [[-12, -12], [8, -12], [-12, 9], [8, 9]]) c.fillRect(ox, oy, 8, 3);
  c.restore();
}
function render() {
  const c = G.ctx; if (!c || !S) return;
  c.fillStyle = '#dfe6d5'; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(0,0,0,.035)'; for (let i = 0; i < 120; i++) c.fillRect((i * 97) % W, (i * 61) % H, 3, 3);
  const pts = S.tr.pts;
  const path = () => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)); c.closePath(); };
  c.lineJoin = 'round'; c.lineCap = 'round';
  path(); c.strokeStyle = '#ffffff'; c.lineWidth = HW * 2 + 10; c.stroke();
  path(); c.strokeStyle = '#d9534f'; c.lineWidth = HW * 2 + 10; c.setLineDash([14, 14]); c.stroke(); c.setLineDash([]);
  path(); c.strokeStyle = '#3d4148'; c.lineWidth = HW * 2; c.stroke();
  path(); c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.setLineDash([16, 18]); c.stroke(); c.setLineDash([]);
  const s0 = pts[0]; c.save(); c.translate(s0.x, s0.y); c.rotate(s0.ang);
  for (let i = -5; i < 5; i++) for (let j = 0; j < 2; j++) { c.fillStyle = (i + j) % 2 ? '#111' : '#fff'; c.fillRect(j * 8 - 8, i * 8.8, 8, 8.8); }
  c.restore();
  c.fillStyle = 'rgba(20,20,20,.18)'; for (const [x, y] of S.skids) c.fillRect(x - 2, y - 2, 4, 4);
  const [rx, ry, ra] = rivalPos(); car(c, rx, ry, ra, '#2f6df6', .55);
  car(c, S.car.x, S.car.y, S.car.ang, '#e5484d', 1);
  P.draw(c);
  if (S.t < .6 && G.playing) {
    c.fillStyle = 'rgba(0,0,0,.6)'; c.beginPath(); c.roundRect(W / 2 - 90, 40, 180, 56, 28); c.fill();
    for (let i = 0; i < 3; i++) { const on = S.t < 0 ? 3 - Math.ceil(-S.t) >= i : true; c.fillStyle = S.t >= 0 ? '#3ddc84' : on ? '#e5484d' : '#333'; c.beginPath(); c.arc(W / 2 - 50 + i * 50, 68, 16, 0, 6.283); c.fill(); }
  }
}
</script></body></html>
